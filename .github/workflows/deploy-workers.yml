name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'cloud/workers/**'
      - 'cloud/shared/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: cloud/workers/package-lock.json

      - name: Install dependencies
        working-directory: cloud/workers
        run: npm ci

      - name: Run TypeScript checks
        working-directory: cloud/workers
        run: npm run types

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloud/workers
          command: deploy

      - name: Notify deployment
        if: success()
        run: |
          echo "Workers deployed successfully to production"
          # Add webhook notification here if needed (Discord, Slack, etc.)
