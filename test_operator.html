<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fleet Operator Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #00d4ff; }
        .panel { background: #16213e; padding: 20px; margin: 10px 0; border-radius: 8px; }
        button { background: #00d4ff; color: #000; border: none; padding: 10px 20px; margin: 5px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00a8cc; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .status.success { background: #0f5132; }
        .status.error { background: #842029; }
        .status.info { background: #055160; }
        #log { background: #0d1117; padding: 15px; border-radius: 4px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        #videoContainer { display: flex; gap: 20px; }
        video { background: #000; border-radius: 4px; }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #joystick { width: 150px; height: 150px; background: #2a2a4a; border-radius: 50%; position: relative; touch-action: none; }
        #joystickKnob { width: 50px; height: 50px; background: #00d4ff; border-radius: 50%; position: absolute; top: 50px; left: 50px; cursor: grab; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Fleet Operator Test Console</h1>
        
        <div class="panel">
            <h3>1. Configuration</h3>
            <table>
                <tr>
                    <th>Setting</th>
                    <th>Value</th>
                </tr>
                <tr>
                    <td>Fleet Worker URL</td>
                    <td><input type="text" id="workerUrl" value="https://fleet-worker.mssemyonov.workers.dev" style="width: 100%;"></td>
                </tr>
                <tr>
                    <td>Cloudflare App ID</td>
                    <td><input type="text" id="appId" value="f4e541276741873484e4885e3506c43f" style="width: 100%;"></td>
                </tr>
                <tr>
                    <td>Cloudflare App Token</td>
                    <td><input type="password" id="appToken" placeholder="Enter your Cloudflare Calls token" style="width: 100%;"></td>
                </tr>
            </table>
        </div>

        <div class="panel">
            <h3>2. Robot List</h3>
            <button onclick="fetchRobots()">🔄 Refresh Robots</button>
            <div id="robotList"></div>
        </div>

        <div class="panel">
            <h3>3. Connection</h3>
            <div class="controls">
                <button id="btnCreateSession" onclick="createOperatorSession()">1️⃣ Create SFU Session</button>
                <button id="btnConnect" onclick="connectToRobot()" disabled>2️⃣ Connect to Robot</button>
                <button id="btnDisconnect" onclick="disconnect()" disabled>❌ Disconnect</button>
            </div>
            <div id="connectionStatus" class="status info">Not connected</div>
        </div>

        <div class="panel">
            <h3>4. Video & Controls</h3>
            <div id="videoContainer">
                <div>
                    <h4>Robot Video</h4>
                    <video id="remoteVideo" width="640" height="480" autoplay playsinline muted></video>
                </div>
                <div>
                    <h4>Joystick Control</h4>
                    <div id="joystick">
                        <div id="joystickKnob"></div>
                    </div>
                    <p>Linear: <span id="linearSpeed">0.00</span> | Angular: <span id="angularSpeed">0.00</span></p>
                    <p><small>Drag the joystick or use WASD keys</small></p>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>📋 Log</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // State
        let operatorSessionId = null;
        let peerConnection = null;
        let cmdVelChannel = null;
        let selectedRobot = null;
        
        const CALLS_API_BASE = 'https://rtc.live.cloudflare.com/v1/apps';
        
        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#51cf66' : '#74c0fc';
            logEl.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }
        
        function setStatus(msg, type = 'info') {
            const el = document.getElementById('connectionStatus');
            el.textContent = msg;
            el.className = `status ${type}`;
        }

        function getHeaders() {
            return {
                'Authorization': `Bearer ${document.getElementById('appToken').value}`,
                'Content-Type': 'application/json'
            };
        }
        
        // Fetch robot list
        async function fetchRobots() {
            const workerUrl = document.getElementById('workerUrl').value;
            try {
                const resp = await fetch(`${workerUrl}/robots`);
                const robots = await resp.json();
                
                const listEl = document.getElementById('robotList');
                if (robots.length === 0) {
                    listEl.innerHTML = '<p>No robots online</p>';
                    return;
                }
                
                listEl.innerHTML = '<table><tr><th>Select</th><th>Robot ID</th><th>Status</th><th>SFU Session</th><th>Video Track</th><th>Last Seen</th></tr>' +
                    robots.map(r => `
                        <tr>
                            <td><input type="radio" name="robot" value="${r.id}" data-session="${r.sfuSessionId}" data-track="${r.videoTrackName}" onchange="selectRobot(this)"></td>
                            <td>${r.id}</td>
                            <td style="color: ${r.status === 'online' ? '#51cf66' : '#ff6b6b'}">${r.status}</td>
                            <td><code>${r.sfuSessionId?.substring(0, 16)}...</code></td>
                            <td><code>${r.videoTrackName || 'N/A'}</code></td>
                            <td>${new Date(r.lastSeen).toLocaleTimeString()}</td>
                        </tr>
                    `).join('') + '</table>';
                    
                log(`Found ${robots.length} robot(s)`, 'success');
            } catch (e) {
                log(`Failed to fetch robots: ${e}`, 'error');
            }
        }
        
        function selectRobot(el) {
            selectedRobot = {
                id: el.value,
                sfuSessionId: el.dataset.session,
                videoTrackName: el.dataset.track
            };
            log(`Selected robot: ${selectedRobot.id}`);
            document.getElementById('btnConnect').disabled = !operatorSessionId;
        }
        
        // Create operator SFU session
        async function createOperatorSession() {
            const appId = document.getElementById('appId').value;
            const appToken = document.getElementById('appToken').value;
            
            if (!appToken) {
                log('Please enter Cloudflare App Token', 'error');
                return;
            }
            
            try {
                log('Creating SFU session...');
                
                // 1. Create session
                const sessionResp = await fetch(`${CALLS_API_BASE}/${appId}/sessions/new`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                const sessionData = await sessionResp.json();
                operatorSessionId = sessionData.sessionId;
                log(`Created session: ${operatorSessionId}`, 'success');
                
                // 2. Create PeerConnection
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
                    bundlePolicy: 'max-bundle'
                });
                
                peerConnection.ontrack = (event) => {
                    log('Received remote track: ' + event.track.kind, 'success');
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };
                
                peerConnection.oniceconnectionstatechange = () => {
                    log(`ICE state: ${peerConnection.iceConnectionState}`);
                };
                
                peerConnection.ondatachannel = (event) => {
                    log(`Received datachannel: ${event.channel.label}`, 'success');
                };
                
                // 3. Create cmd_vel DataChannel (local - we send commands)
                cmdVelChannel = peerConnection.createDataChannel('cmd_vel', { ordered: true });
                cmdVelChannel.onopen = () => log('cmd_vel channel opened', 'success');
                cmdVelChannel.onclose = () => log('cmd_vel channel closed');
                cmdVelChannel.onerror = (e) => log(`cmd_vel error: ${e}`, 'error');
                
                // 4. Add recvonly transceiver for video
                peerConnection.addTransceiver('video', { direction: 'recvonly' });
                
                // Session created, but we'll do SDP negotiation when connecting to robot
                setStatus(`Session created: ${operatorSessionId.substring(0, 16)}...`, 'success');
                document.getElementById('btnCreateSession').disabled = true;
                document.getElementById('btnConnect').disabled = !selectedRobot;
                document.getElementById('btnDisconnect').disabled = false;
                log('Session ready. Click "Connect to Robot" to pull video.', 'success');
                
            } catch (e) {
                log(`Failed to create session: ${e}`, 'error');
                setStatus('Failed to create session', 'error');
            }
        }
        
        // Connect to selected robot
        async function connectToRobot() {
            if (!selectedRobot || !operatorSessionId) {
                log('Select a robot and create session first', 'error');
                return;
            }
            
            const workerUrl = document.getElementById('workerUrl').value;
            const appId = document.getElementById('appId').value;
            
            try {
                log(`Connecting to robot ${selectedRobot.id}...`);
                
                // 1. Create offer with our DataChannel and recvonly video
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                log('Created local offer');
                
                // 2. Pull robot's video track AND register our session
                log(`Pulling video track: ${selectedRobot.videoTrackName} from session ${selectedRobot.sfuSessionId}`);
                
                const pullResp = await fetch(`${CALLS_API_BASE}/${appId}/sessions/${operatorSessionId}/tracks/new`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        sessionDescription: { sdp: offer.sdp, type: 'offer' },
                        tracks: [{
                            location: 'remote',
                            sessionId: selectedRobot.sfuSessionId,
                            trackName: selectedRobot.videoTrackName
                        }]
                    })
                });
                const pullData = await pullResp.json();
                log(`Pull response: ${JSON.stringify(pullData)}`);
                
                if (pullData.errorCode) {
                    log(`Pull error: ${pullData.errorDescription}`, 'error');
                    return;
                }
                
                // 3. Set remote description
                if (pullData.sessionDescription) {
                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(pullData.sessionDescription)
                    );
                    log('Set remote description', 'success');
                }
                
                // 4. Handle renegotiation if needed
                if (pullData.requiresImmediateRenegotiation) {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    const renegoResp = await fetch(`${CALLS_API_BASE}/${appId}/sessions/${operatorSessionId}/renegotiate`, {
                        method: 'PUT',
                        headers: getHeaders(),
                        body: JSON.stringify({
                            sessionDescription: { sdp: answer.sdp, type: 'answer' }
                        })
                    });
                    const renegoData = await renegoResp.json();
                    log(`Renegotiation: ${JSON.stringify(renegoData)}`, 'success');
                }
                
                // 5. Wait for ICE connection
                log('Waiting for ICE connection...');
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        log('ICE timeout - continuing anyway', 'warn');
                        resolve();
                    }, 5000);
                    
                    if (peerConnection.iceConnectionState === 'connected' || 
                        peerConnection.iceConnectionState === 'completed') {
                        clearTimeout(timeout);
                        resolve();
                        return;
                    }
                    
                    const stateHandler = () => {
                        log(`ICE state: ${peerConnection.iceConnectionState}`);
                        if (peerConnection.iceConnectionState === 'connected' ||
                            peerConnection.iceConnectionState === 'completed') {
                            clearTimeout(timeout);
                            peerConnection.removeEventListener('iceconnectionstatechange', stateHandler);
                            resolve();
                        } else if (peerConnection.iceConnectionState === 'failed') {
                            clearTimeout(timeout);
                            peerConnection.removeEventListener('iceconnectionstatechange', stateHandler);
                            reject(new Error('ICE failed'));
                        }
                    };
                    peerConnection.addEventListener('iceconnectionstatechange', stateHandler);
                });
                log('ICE connected!', 'success');
                
                // 6. Register our DataChannel with SFU
                const dcResp = await fetch(`${CALLS_API_BASE}/${appId}/sessions/${operatorSessionId}/datachannels/new`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        dataChannels: [{
                            location: 'local',
                            dataChannelName: 'cmd_vel'
                        }]
                    })
                });
                const dcData = await dcResp.json();
                log(`DataChannel registered: ${JSON.stringify(dcData)}`);
                
                // Small delay for SFU to process DataChannel
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 7. Signal robot to subscribe to our cmd_vel channel
                const connectResp = await fetch(`${workerUrl}/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        robotId: selectedRobot.id,
                        operatorSessionId: operatorSessionId
                    })
                });
                const connectData = await connectResp.json();
                
                if (connectData.success) {
                    log('Signal sent to robot!', 'success');
                    setStatus(`Connected to ${selectedRobot.id}`, 'success');
                } else {
                    log(`Connect failed: ${JSON.stringify(connectData)}`, 'error');
                }
                
            } catch (e) {
                log(`Failed to connect: ${e}`, 'error');
                setStatus('Connection failed', 'error');
            }
        }
        
        function disconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            cmdVelChannel = null;
            operatorSessionId = null;
            selectedRobot = null;
            
            document.getElementById('btnCreateSession').disabled = false;
            document.getElementById('btnConnect').disabled = true;
            document.getElementById('btnDisconnect').disabled = true;
            document.getElementById('remoteVideo').srcObject = null;
            
            setStatus('Disconnected', 'info');
            log('Disconnected');
        }
        
        // Joystick control
        function sendCommand(linear, angular) {
            if (cmdVelChannel && cmdVelChannel.readyState === 'open') {
                const cmd = {
                    linear: { x: linear, y: 0, z: 0 },
                    angular: { x: 0, y: 0, z: angular }
                };
                cmdVelChannel.send(JSON.stringify(cmd));
            }
            document.getElementById('linearSpeed').textContent = linear.toFixed(2);
            document.getElementById('angularSpeed').textContent = angular.toFixed(2);
        }
        
        // Setup joystick
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystickKnob');
        let dragging = false;
        
        function updateKnob(clientX, clientY) {
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            
            const maxDist = rect.width / 2 - 25;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            
            knob.style.left = (rect.width / 2 - 25 + dx) + 'px';
            knob.style.top = (rect.height / 2 - 25 + dy) + 'px';
            
            const linear = -dy / maxDist;  // Forward/backward
            const angular = -dx / maxDist; // Left/right
            sendCommand(linear, angular);
        }
        
        joystick.addEventListener('mousedown', (e) => { dragging = true; updateKnob(e.clientX, e.clientY); });
        document.addEventListener('mousemove', (e) => { if (dragging) updateKnob(e.clientX, e.clientY); });
        document.addEventListener('mouseup', () => { 
            dragging = false; 
            knob.style.left = '50px'; 
            knob.style.top = '50px';
            sendCommand(0, 0);
        });
        
        // Keyboard controls
        const keyState = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
                keyState[e.key.toLowerCase()] = true;
                updateFromKeys();
            }
        });
        document.addEventListener('keyup', (e) => {
            if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
                keyState[e.key.toLowerCase()] = false;
                updateFromKeys();
            }
        });
        
        function updateFromKeys() {
            let linear = 0, angular = 0;
            if (keyState.w) linear += 0.5;
            if (keyState.s) linear -= 0.5;
            if (keyState.a) angular += 0.5;
            if (keyState.d) angular -= 0.5;
            sendCommand(linear, angular);
        }
        
        // Initial load
        fetchRobots();
    </script>
</body>
</html>
