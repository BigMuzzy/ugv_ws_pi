<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Teleoperation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🤖 Robot Teleoperation</h1>
        <div class="status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div class="status-indicator">
                <span>Data: </span>
                <span id="latency">--</span>ms
            </div>
            <div class="status-indicator">
                <span>Video: </span>
                <span id="videoLatency">--</span>ms
            </div>
        </div>
    </header>

    <main>
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <canvas id="latencyCanvas" style="display:none;"></canvas>
            <div class="video-overlay">
                <span id="videoStatus">No video</span>
            </div>
        </div>
        
        <div class="controls-panel">
            <div class="panel">
                <h2>Connection</h2>
                <div class="connection-controls">
                    <input type="text" id="serverUrl" placeholder="ws://localhost:8080/ws" value="">
                    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>Emergency Stop</h2>
                <button class="emergency" id="estopBtn" onclick="toggleEmergencyStop()">
                    🛑 EMERGENCY STOP
                </button>
            </div>
            
            <div class="panel">
                <h2>Controls</h2>
                <div class="joystick-container">
                    <div class="joystick" id="joystick">
                        <div class="joystick-knob" id="joystickKnob"></div>
                    </div>
                    <div class="keyboard-info">
                        <p>Keyboard: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or Arrows</p>
                        <p><kbd>Space</kbd> Emergency Stop</p>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>Statistics</h2>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">Linear X</div>
                        <div class="stat-value" id="linearX">0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Angular Z</div>
                        <div class="stat-value" id="angularZ">0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Commands/s</div>
                        <div class="stat-value" id="cmdRate">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Connection</div>
                        <div class="stat-value" id="connState">Closed</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
