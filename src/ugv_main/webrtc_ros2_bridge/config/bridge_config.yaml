webrtc:
  signaling_server: "ws://localhost:8080"
  stun_servers:
    - "stun:stun.l.google.com:19302"
    - "stun:stun1.l.google.com:19302"
  turn_servers: []  # Add if needed for NAT traversal
  # Example TURN server config:
  # - url: "turn:your-turn-server.com:3478"
  #   username: "user"
  #   credential: "password"

video:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 30
  codec: "VP8"  # VP8, VP9, or H264
  bitrate: 1000000  # 1 Mbps

robot:
  cmd_vel_topic: "/cmd_vel"
  max_linear_speed: 1.0
  max_angular_speed: 2.0
  command_timeout_ms: 500
  publish_rate_hz: 20

server:
  host: "0.0.0.0"
  port: 8080
  web_root: ""  # Set to static files directory if needed
