# Mode definitions for the lifecycle-based mode manager.
# All lifecycle nodes are launched at startup in unconfigured state via
# mode_lifecycle.launch.py. The mode manager activates/deactivates them.

modes:
  idle:
    description: 'All nodes inactive/unconfigured'

  mapping:
    description: 'SLAM mapping mode (slam_toolbox active)'

  navigation:
    description: 'Navigation with Nav2 (map_server + AMCL + Nav2 active)'
    default_arguments:
      map_path: '/home/ws/ugv_ws/maps/current_map.yaml'
