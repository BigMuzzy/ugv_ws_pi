modes:
  # Mapping mode - SLAM with SLAM Toolbox
  mapping:
    launch_package: 'ugv_launch_manager'
    launch_file: 'mode_mapping.launch.py'
    arguments:
      map_path: '/home/ws/ugv_ws/maps/new_map'
    description: 'SLAM mapping mode (builds map)'

  # Navigation mode - Nav2 with AMCL localization
  navigation:
    launch_package: 'ugv_launch_manager'
    launch_file: 'mode_navigation.launch.py'
    arguments:
      map_path: '/home/ws/ugv_ws/maps/second_floor.yaml'
    description: 'Navigation with Nav2 (uses existing map)'
